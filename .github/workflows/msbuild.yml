name: Build Source SDK 2007 Mod

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную одной кнопкой в интерфейсе GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      SOLUTION_PATH: "src/game_episodic-2005.sln"
      BUILD_CONFIGURATION: "Release"
      BUILD_PLATFORM: "Win32"

    steps:
    # 1. Клонируем исходный код репозитория
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # Экономия времени на скачивании истории коммитов

    # 2. Настраиваем кэширование для ускорения повторных сборок
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          src/game/client/Release_*
          src/game/server/Release_*
          src/obj
        key: ${{ runner.os }}-source-sdk-${{ hashFiles('**/*.cpp', '**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-source-sdk-

    # 3. Принудительно отключаем устаревшие хуки памяти Valve для совместимости с MSVC 2022
    - name: Patch memoverride.cpp for modern MSVC
      shell: powershell
      run: |
        $filePath = "src/public/tier0/memoverride.cpp"
        if (Test-Path $filePath) {
            $content = Get-Content $filePath -Raw
            # Вставляем макрос отключения хуков в самое начало файла
            $patchedContent = "#define NO_MEMOVERRIDE`r`n" + $content
            Set-Content -Path $filePath -Value $patchedContent -Encoding utf8
            Write-Host "Successfully patched memoverride.cpp with NO_MEMOVERRIDE"
        } else {
            Write-Warning "Warning: memoverride.cpp not found at $filePath. Skipping patch step."
        }

    # 4. Находим актуальный MSBuild на виртуальной машине
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 5. Автоматически конвертируем древний формат .sln/.vcproj (VS2008) в современный .vcxproj (VS2022)
    - name: Upgrade Legacy VS2008 Solution to Modern Format
      shell: powershell
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) {
            $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
        }
        $devenv = & $vswhere -latest -property productPath
        echo "Found Visual Studio DevEnv at: $devenv"
        
        # Запуск конвертации формата решения и проектов
        Start-Process -FilePath $devenv -ArgumentList @("${{ env.SOLUTION_PATH }}", "/Upgrade") -Wait -NoNewWindow

    # 6. Запускаем компиляцию (клиентская и серверная библиотеки мода)
    - name: Build Solution
      shell: cmd
      run: |
        msbuild "${{ env.SOLUTION_PATH }}" /p:Configuration="${{ env.BUILD_CONFIGURATION }}" /p:Platform="${{ env.BUILD_PLATFORM }}" /p:BuildInParallel=true /m:2 /p:TrackFileAccess=false

    # 7. Сохраняем скомпилированные client.dll и server.dll в артефакты сборки GitHub
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: source-sdk-2007-binaries
        path: |
          src/game/client/*_episodic.dll
          src/game/server/*_episodic.dll
        if-no-files-found: warn
