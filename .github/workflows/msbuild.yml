name: Build Source SDK 2007 Mod

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      SOLUTION_PATH: "src/game_episodic-2005.sln"
      BUILD_CONFIGURATION: "Release"
      BUILD_PLATFORM: "Win32"

    steps:
    # 1. Скачиваем исходный код
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 2. Настраиваем кэширование
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          src/game/client/Release_*
          src/game/server/Release_*
          src/obj
        key: ${{ runner.os }}-source-sdk-${{ hashFiles('**/*.cpp', '**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-source-sdk-

    # 3. Полностью очищаем memoverride.cpp для обхода старых хуков CRT
    - name: Clean memoverride.cpp for modern MSVC
      shell: powershell
      run: |
        $filePath = "src/public/tier0/memoverride.cpp"
        if (Test-Path $filePath) {
            Clear-Content -Path $filePath
            Write-Host "Successfully cleared memoverride.cpp"
        }

    # 4. Создаем файл свойств MSBuild, чтобы принудительно отключить строгие стандарты C++20/C++17
    - name: Create MSBuild Override Properties File
      shell: powershell
      run: |
        $propsContent = @"
        <?xml version="1.0" encoding="utf-8"?>
        <Project ToolsVersion="4.0" xmlns="http://microsoft.com">
          <ItemDefinitionGroup>
            <ClCompile>
              <ConformanceMode>false</ConformanceMode>
              <LanguageStandard>stdcpp14</LanguageStandard>
              <AdditionalOptions>/permissive %(AdditionalOptions)</AdditionalOptions>
              <TreatWarningAsError>false</TreatWarningAsError>
            </ClCompile>
          </ItemDefinitionGroup>
        </Project>
        "@
        # Сохраняем файл в корневом каталоге сборки
        Set-Content -Path "ForceFlags.props" -Value $propsContent -Encoding utf8
        Write-Host "Successfully created ForceFlags.props configuration file."

    # 5. Находим MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 6. Конвертируем .sln/.vcproj в современный .vcxproj
    - name: Upgrade Legacy VS2008 Solution to Modern Format
      shell: powershell
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) { $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" }
        $devenv = & $vswhere -latest -property productPath
        Start-Process -FilePath $devenv -ArgumentList @("${{ env.SOLUTION_PATH }}", "/Upgrade") -Wait -NoNewWindow

    # 7. Запускаем компиляцию с подключением нашего файла свойств ForceFlags.props
    - name: Build Solution
      shell: cmd
      run: |
        msbuild "${{ env.SOLUTION_PATH }}" /p:Configuration="${{ env.BUILD_CONFIGURATION }}" /p:Platform="${{ env.BUILD_PLATFORM }}" /p:BuildInParallel=true /m:2 /p:TrackFileAccess=false /p:ForceImportBeforeCppTargets="%CD%\ForceFlags.props" /p:IgnoreDefaultLibraryNames="libc;libcd"

    # 8. Сохраняем готовые client.dll и server.dll
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: source-sdk-2007-binaries
        path: |
          src/game/client/*_episodic.dll
          src/game/server/*_episodic.dll
        if-no-files-found: warn
